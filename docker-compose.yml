name: freeflow

x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-freeflow}
  POSTGRES_USER: ${POSTGRES_USER:-freeflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freeflow_local}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  INFERENCE_EXECUTION: worker
  # Runtime data is deliberately outside the bind-mounted source tree. This
  # prevents container data from being mixed with or shadowing repository files.
  QC_MEDIA_ROOT: /var/lib/freeflow/media
  QC_MODEL_ROOT: /var/lib/freeflow/models
  QC_DATASET_ROOT: /var/lib/freeflow/datasets
  DATA_UPLOAD_MAX_NUMBER_FILES: ${DATA_UPLOAD_MAX_NUMBER_FILES:-50000}
  DATA_UPLOAD_MAX_NUMBER_FIELDS: ${DATA_UPLOAD_MAX_NUMBER_FIELDS:-100000}
  DATASET_MAX_ARCHIVE_FILES: ${DATASET_MAX_ARCHIVE_FILES:-2000000}
  DATASET_MAX_EXTRACTED_BYTES: ${DATASET_MAX_EXTRACTED_BYTES:-2199023255552}

x-django-volumes: &django-volumes
  - .:/app
  - runtime_artifacts:/var/lib/freeflow

x-worker: &worker
  restart: unless-stopped
  environment:
    <<: *django-env
    SKIP_BOOTSTRAP: "true"
    YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
  volumes: *django-volumes
  depends_on:
    platform-web:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    container_name: freeflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freeflow}
      POSTGRES_USER: ${POSTGRES_USER:-freeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freeflow_local}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freeflow} -d ${POSTGRES_DB:-freeflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: freeflow_redis
    restart: unless-stopped
    # Redis is only broker/result cache. Durable business data lives in PostgreSQL.
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  platform-web:
    build:
      context: .
      target: platform-web
    image: freeflow/platform-web:dev
    container_name: freeflow_platform_web
    restart: unless-stopped
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "${QC_PORT:-8090}:8000"
    environment:
      <<: *django-env
    volumes: *django-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  platform-worker:
    build:
      context: .
      target: platform-worker
    image: freeflow/platform-worker:dev
    container_name: freeflow_platform_worker
    <<: *worker

  annotation-worker:
    build:
      context: .
      target: annotation-worker
    image: freeflow/annotation-worker:dev
    container_name: freeflow_annotation_worker
    <<: *worker

  annotation-yolo26-detection:
    build:
      context: .
      dockerfile: annotations/runtime/Dockerfile
    image: freeflow/annotation-yolo26:dev
    container_name: freeflow_annotation_yolo26_detection
    entrypoint: ["python", "/app/annotations/runtime/server.py"]
    restart: unless-stopped
    environment:
      AUTO_MODEL_PATH: /app/cvat/serverless/custom/yolo26_detection/nuclio/yolo26s.pt
      AUTO_MODEL_KIND: detector
      AUTO_MODEL_DEVICE: ${YOLO_DEVICE:-0}
    volumes:
      - .:/app:ro
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  annotation-yolo26-pose:
    image: freeflow/annotation-yolo26:dev
    container_name: freeflow_annotation_yolo26_pose
    entrypoint: ["python", "/app/annotations/runtime/server.py"]
    restart: unless-stopped
    depends_on:
      annotation-yolo26-detection:
        condition: service_started
    environment:
      AUTO_MODEL_PATH: /app/cvat/serverless/custom/yolo26_pose/nuclio/yolo26s-pose.pt
      AUTO_MODEL_KIND: pose
      AUTO_MODEL_DEVICE: ${YOLO_DEVICE:-0}
      AUTO_POSE_LABEL: person_pose
      AUTO_POSE_KEYPOINTS: '["nose","left_eye","right_eye","left_ear","right_ear","left_shoulder","right_shoulder","left_elbow","right_elbow","left_wrist","right_wrist","left_hip","right_hip","left_knee","right_knee","left_ankle","right_ankle"]'
    volumes:
      - .:/app:ro
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  quality-worker:
    build:
      context: .
      target: quality-worker
    image: freeflow/quality-worker:dev
    container_name: freeflow_quality_worker
    <<: *worker

  training-worker:
    build:
      context: .
      target: training-worker
    image: freeflow/training-worker:dev
    container_name: freeflow_training_worker
    <<: *worker

  ai-rules-worker:
    build:
      context: .
      target: ai-rules-worker
    image: freeflow/ai-rules-worker:dev
    container_name: freeflow_ai_rules_worker
    <<: *worker

volumes:
  postgres_data:
    labels:
      com.freeflow.reset-group: all-data
  runtime_artifacts:
    labels:
      com.freeflow.reset-group: all-data
